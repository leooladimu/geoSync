<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0e0f0f"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="5" fill="#c97d3a"/>
  
  <!-- Center content area -->
  <!-- Earth symbol -->
  <text x="600" y="190" text-anchor="middle" dominant-baseline="central" font-size="80" fill="#c97d3a" font-family="serif">♁</text>
  
  <!-- App name -->
  <text x="600" y="290" text-anchor="middle" dominant-baseline="central" font-size="68" fill="#e8e4dc" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">geoSync</text>
  
  <!-- Tagline -->
  <text x="600" y="370" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#9a9590" font-family="Helvetica, Arial, sans-serif">Science-Grounded Relationship Compatibility</text>
  
