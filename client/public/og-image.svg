<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e0f0f"/>
      <stop offset="100%" style="stop-color:#1c1e1f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c97d3a"/>
      <stop offset="100%" style="stop-color:#e09b5a"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Accent line top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  
  <!-- Earth symbol -->
  <text x="600" y="180" text-anchor="middle" font-size="90" fill="#c97d3a" font-family="serif">♁</text>
  
  <!-- Title -->
  <text x="600" y="280" text-anchor="middle" font-size="72" fill="#e8e4dc" font-family="Georgia, serif" font-weight="600">geoSync</text>
  
  <!-- Subtitle -->
  <text x="600" y="345" text-anchor="middle" font-size="26" fill="#9a9590" font-family="Inter, Helvetica, sans-serif">Science-Grounded Relationship Compatibility</text>
  
  <!-- Three dimension labels centered tightly -->
  <text x="310" y="430" text-anchor="middle" font-size="18" fill="#c97d3a" font-family="Inter, sans-serif">☉ Chronotype</text>
  <text x="600" y="430" text-anchor="middle" font-size="18" fill="#c97d3a" font-family="Inter, sans-serif">⚡ Stress Response</text>
  <text x="890" y="430" text-anchor="middle" font-size="18" fill="#c97d3a" font-family="Inter, sans-serif">♎ Seasonal Rhythm</text>
  
  <!-- Decorative dots between -->
  <circle cx="455" cy="425" r="3" fill="#2a2c2e"/>
  <circle cx="745" cy="425" r="3" fill="#2a2c2e"/>
  
  <!-- Tagline -->
  <text x="600" y="520" text-anchor="middle" font-size="20" fill="#5c5854" font-family="Inter, sans-serif">Not astrology — environmental imprinting</text>
  
  <!-- URL -->
  <text x="600" y="570" text-anchor="middle" font-size="18" fill="#c97d3a" font-family="monospace">geosync.oleo.dev</text>
  
  <!-- Accent line bottom -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>
